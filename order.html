<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Summary</title>
  <style>
    :root {
      --bg: #090912;
      --panel: rgba(18, 13, 41, 0.96);
      --text: #f4f1ff;
      --muted: #b8adf2;
      --accent: #c98cff;
      --border: rgba(156, 77, 255, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, rgba(133, 79, 255, 0.24), transparent 18%),
                  radial-gradient(circle at bottom right, rgba(86, 42, 202, 0.18), transparent 18%),
                  linear-gradient(180deg, #07070c 0%, #0b0a16 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(860px, 100%);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      box-shadow: 0 0 100px rgba(156, 77, 255, 0.16);
      overflow: hidden;
    }
    .content {
      padding: 36px;
      display: grid;
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: 0.04em;
      color: #f7f3ff;
    }
    .notice {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 18px 20px;
      color: var(--muted);
      line-height: 1.7;
    }
    .summary {
      display: grid;
      gap: 14px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .item span:first-child { color: var(--muted); }
    .item strong { color: #fff; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #c98cff, #7f3bff);
      color: white;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 16px 40px rgba(201, 140, 255, 0.18);
      transition: transform .16s ease, filter .16s ease;
    }
    .button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .error {
      color: #ff7fa4;
      font-size: 0.95rem;
    }
    @media (max-width: 700px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="content">
      <h1>Захиалгын мэдээлэл</h1>
      <div class="notice">Таньд илгээсэн мэдээллийг шалгаад дараа нь төлбөр рүү шилжинэ үү.</div>
      <div class="summary">
        <div class="item"><span>Үйлчилгээ</span><strong id="service">---</strong></div>
        <div class="item"><span>Линк</span><strong id="link">---</strong></div>
        <div class="item"><span>Утас</span><strong id="phone">---</strong></div>
        <div class="item"><span>Тоо ширхэг</span><strong id="count">---</strong></div>
        <div class="item"><span>Нэгж үнэ</span><strong id="price">---</strong></div>
      </div>
      <div class="actions">
        <button id="continueButton" class="button">Захиалах</button>
        <a href="index.html" class="button" style="background: rgba(255,255,255,0.1); color: #fff; box-shadow:none;">Буцах</a>
      </div>
      <p class="error" id="errorText"></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const service = params.get('service');
    const price = params.get('price');
    const link = params.get('link');
    const phone = params.get('phone');
    const count = params.get('count');
    const errorText = document.getElementById('errorText');

    if (!service || !price || !link || !phone || !count) {
      errorText.textContent = 'Захиалгын мэдээлэл олдсонгүй. Буцах товчийг дараад дахин оролдоно уу.';
    }

    document.getElementById('service').textContent = service || '---';
    document.getElementById('link').textContent = link || '---';
    document.getElementById('phone').textContent = phone || '---';
    document.getElementById('count').textContent = count ? count + 'k ширхэг' : '---';
    document.getElementById('price').textContent = price ? price + '₮ / 1k' : '---';

    document.getElementById('continueButton').addEventListener('click', () => {
      if (!service || !price || !link || !phone || !count) {
        return;
      }
      const paymentUrl = new URL('payment.html', window.location.origin);
      paymentUrl.search = window.location.search;
      window.location.href = paymentUrl.toString();
    });
  </script>
</body>
</html>
