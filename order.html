<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Захиалга амжилттай</title>
  <style>
    :root {
      --bg: #07070c;
      --card: rgba(20, 10, 56, 0.95);
      --text: #f4f2ff;
      --muted: #a89ee2;
      --accent: #ab65ff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, rgba(124, 70, 255, 0.18), transparent 18%),
        radial-gradient(circle at bottom right, rgba(81, 38, 207, 0.2), transparent 16%),
        linear-gradient(180deg, #08070e 0%, #100d23 100%),
        url('bg.jpg') center/cover no-repeat;
      background-blend-mode: screen, screen, normal, normal;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(860px, 100%);
      border-radius: 30px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 120px rgba(171, 101, 255, 0.18);
      overflow: hidden;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 0;
    }
    .hero-panel {
      padding: 36px;
    }
    .hero-image {
      min-height: 420px;
      background: linear-gradient(180deg, rgba(113, 51, 255, 0.9), rgba(55, 20, 154, 0.95));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-image::before {
      content: '';
      position: absolute;
      inset: 18px;
      border-radius: 30px;
      background: radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 35%);
    }
    .hero-image .preview {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 30px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .preview-card {
      width: 90%;
      height: 84%;
      border-radius: 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 24px;
      font-size: 1.1rem;
      line-height: 1.4;
    }
    .hero-panel h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: 0.04em;
    }
    .hero-panel p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }
    .order-meta {
      display: grid;
      gap: 14px;
    }
    .meta-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px 20px;
    }
    .meta-title {
      margin: 0 0 8px;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .meta-value {
      margin: 0;
      font-size: 1rem;
      color: #fff;
      word-break: break-word;
    }
    .meta-value strong {
      color: #e9e7ff;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      color: #cabcff;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover {
      color: #fff;
    }
    @media (max-width: 840px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero-image {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="hero-panel">
        <h1>Захиалга хүлээн авлаа</h1>
        <p>Та амжилттай бүтээгдэхүүнээ, холбоо барих мэдээллээ явууллаа. Доорх зураг нь таны сонгосон бүтээгдэхүүний хураангуйг харуулна.</p>
        <div class="order-meta">
          <div class="meta-item">
            <div class="meta-title">Сонгосон үйлчилгээ</div>
            <p class="meta-value" id="metaService">---</p>
          </div>
          <div class="meta-item">
            <div class="meta-title">Линк</div>
            <p class="meta-value" id="metaLink">---</p>
          </div>
          <div class="meta-item">
            <div class="meta-title">Утас</div>
            <p class="meta-value" id="metaPhone">---</p>
          </div>
          <div class="meta-item">
            <div class="meta-title">Тоо ширхэг</div>
            <p class="meta-value" id="metaCount">---</p>
          </div>
          <div class="meta-item">
            <div class="meta-title">Нэгж үнэ</div>
            <p class="meta-value" id="metaPrice">---</p>
          </div>
        </div>
        <a class="back-link" href="index.html">← Буцах</a>
      </div>
      <div class="hero-image">
        <div class="preview">
          <div class="preview-card" id="previewCard">Таны захиалгын бүтээгдэхүүний товч хураангуй энд харагдана.</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const service = params.get('service');
    const price = params.get('price');
    const link = params.get('link');
    const phone = params.get('phone');
    const count = params.get('count');

    const meta = {
      service: document.getElementById('metaService'),
      link: document.getElementById('metaLink'),
      phone: document.getElementById('metaPhone'),
      count: document.getElementById('metaCount'),
      price: document.getElementById('metaPrice')
    };
    if (!service || !link || !phone || !count) {
      document.getElementById('previewCard').textContent = 'Захиалгын мэдээлэл олдсонгүй. Та "Буцах" товчийг дарж мэдээллээ дахин оруулна уу.';
      meta.service.textContent = 'Хоосон';
      meta.link.textContent = '---';
      meta.phone.textContent = '---';
      meta.count.textContent = '---';
      meta.price.textContent = '---';
    } else {
      meta.service.textContent = service;
      meta.link.textContent = link;
      meta.phone.textContent = phone;
      meta.count.textContent = count + ' ширхэг';
      meta.price.textContent = price + '₮ / 1k';
      document.getElementById('previewCard').innerHTML = `<strong>${service}</strong><br><span style="color: #dcd6ff;">${count} ширхэг заказ</span><br><span style="color: #c8b8ff; font-size: 0.95rem;">Нэгж үнэ ${price}₮</span>`;
    }
  </script>
</body>
</html>
