<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GAMA</title>
    <style>
        body{font-family:sans-serif;padding:20px}
        .container{display:flex;gap:20px;justify-content:center}
        .card{border:1px solid #ccc;padding:20px;cursor:pointer;text-align:center}
        .hidden{display:none}
        form{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:auto}
    </style>
</head>
<body>
    <div id="home">
        <h1>GAMA Store</h1>
        <div class="container">
            <div class="card" onclick="showGame('Standoff2')">Standoff 2</div>
            <div class="card" onclick="showGame('Mobile Legends')">Mobile Legends</div>
            <div class="card" onclick="showGame('PUBG')">PUBG</div>
        </div>
    </div>
    <div id="game-page" class="hidden">
        <h2 id="game-title"></h2>
        <form id="orderForm">
            <input type="number" id="amount" placeholder="Quantity" required>
            <input type="email" id="email" placeholder="Gmail" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <button type="submit">Submit Order</button>
        </form>
        <button onclick="document.location.reload()">Back</button>
    </div>
    <script>
        const BOT_TOKEN = "YOUR_BOT_TOKEN";
        const CHAT_ID = "YOUR_CHAT_ID";
        function showGame(name) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('game-page').classList.remove('hidden');
            document.getElementById('game-title').innerText = name;
        }
        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = `Game: ${document.getElementById('game-title').innerText}%0AAmount: ${document.getElementById('amount').value}%0AEmail: ${document.getElementById('email').value}%0APhone: ${document.getElementById('phone').value}`;
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${msg}`);
            alert('Order sent successfully!');
        });
    </script>
</body>
</html>
