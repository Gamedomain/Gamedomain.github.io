<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standoff gold</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: var(--text);
    }

    .container {
      width: min(560px, calc(100vw - 32px));
      padding: 28px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.96);
    }

    h1 { margin-bottom: 20px; }

    .field { margin-top: 16px; }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      font-weight: bold;
      cursor: pointer;
    }

    #status { margin-top: 15px; }
  </style>
</head>

<body>

<section class="container">
  <h1>Standoff gold</h1>

  <form id="orderForm">

    <div class="field">
      <label>Утасны дугаар</label>
      <input id="phone" type="tel" required>
    </div>

    <div class="field">
      <label>Хэдэн алтан ширхэг авах</label>
      <input id="amount" type="number" required>
    </div>

    <div class="field">
      <label>Graffiti зарсан зургаа энд оруулна уу!</label>
      <input id="receiptFile" type="file" accept="image/*" required>
    </div>

    <button type="submit">Болсон</button>

  </form>

  <div id="status">Fill and send</div>
</section>

<script>
const botToken = "YOUR_BOT_TOKEN_HERE";
const chatId = "YOUR_CHAT_ID_HERE";

const form = document.getElementById("orderForm");
const statusEl = document.getElementById("status");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const phone = document.getElementById("phone").value;
  const amount = document.getElementById("amount").value;
  const file = document.getElementById("receiptFile").files[0];

  const message = `📌 Standoff gold захиалга\n\n` +
    `Утас: ${phone}\n` +
    `Алт: ${amount}`;

  const formData = new FormData();
  formData.append("chat_id", chatId);
  formData.append("document", file);
  formData.append("caption", message);

  try {
    statusEl.innerText = "Sending...";

    await fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
      method: "POST",
      body: formData
    });

    statusEl.innerText = "✅ Амжилттай илгээгдлээ!";
    form.reset();

  } catch (err) {
    statusEl.innerText = "❌ Алдаа гарлаа!";
  }
});
</script>

</body>
</html>
