<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monpay Төлбөр - Bot Service</title>
  <style>
    :root {
      --bg: #180641;
      --panel: rgba(25, 7, 68, 0.95);
      --text: #f5eeff;
      --muted: #b6a5ff;
      --accent: #d38cff;
      --border: rgba(214, 140, 255, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(163, 90, 255, 0.18), transparent 20%),
                  radial-gradient(circle at bottom right, rgba(111, 45, 255, 0.24), transparent 22%),
                  linear-gradient(180deg, #120433 0%, #0b0520 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 0 80px rgba(211, 140, 255, 0.18);
      overflow: hidden;
    }
    .content {
      padding: 36px;
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.6rem);
      letter-spacing: 0.04em;
    }
    .warning {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 18px 20px;
      color: #f4e7ff;
      line-height: 1.7;
    }
    .warning strong {
      color: #ffd1ff;
    }
    .pay-card {
      display: grid;
      gap: 18px;
      align-items: center;
      justify-items: center;
    }
    .qr-frame {
      width: min(320px, 100%);
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .qr-frame img {
      width: 100%;
      height: auto;
      border-radius: 18px;
      object-fit: contain;
    }
    .pay-note {
      color: var(--muted);
      text-align: center;
      font-size: 0.96rem;
      line-height: 1.8;
    }
    .done-btn {
      width: 100%;
      max-width: 320px;
      padding: 16px 0;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #d48cff, #8f3bff);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(212, 140, 255, 0.18);
      transition: transform .16s ease, filter .16s ease;
    }
    .done-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    .summary {
      display: grid;
      gap: 12px;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #efe8ff;
    }
    .summary-item span:first-child {
      color: var(--muted);
    }
    @media (max-width: 640px) {
      .content {
        padding: 24px;
      }
      .qr-frame {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="content">
      <h1>Төлбөр хийх</h1>
      <div class="warning">
        <strong>Мөнгөө хийсэн тохиолдолд БОЛСОН гэх товчийг дарна уу!</strong>
      </div>
      <div class="pay-card">
        <div class="qr-frame">
          <img src="monpay.png" alt="Monpay QR" />
        </div>
        <p class="pay-note">QR кодыг уншуулж Monpay-ээр төлбөрөө хийсний дараа доорх “БОЛСОН” товчийг дарна уу.</p>
      </div>
      <div class="summary">
        <div class="summary-item"><span>Линк</span><strong id="summaryLink">---</strong></div>
        <div class="summary-item"><span>Утас</span><strong id="summaryPhone">---</strong></div>
        <div class="summary-item"><span>Тоо ширхэг</span><strong id="summaryCount">---</strong></div>
      </div>
      <button id="paidButton" class="done-btn">БОЛСОН</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const link = params.get('link') || '---';
    const phone = params.get('phone') || '---';
    const count = params.get('count') || '---';
    document.getElementById('summaryLink').textContent = link;
    document.getElementById('summaryPhone').textContent = phone;
    document.getElementById('summaryCount').textContent = count + 'k ширхэг';
    document.getElementById('paidButton').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
